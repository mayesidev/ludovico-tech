name: Migrate Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published semantic-release tag whose migrations will apply
        required: true
        type: string
      database:
        description: Type ludovico-tech-production to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out the trusted migration gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Preserve the trusted migration gate
        run: cp scripts/release-gates.ts "$RUNNER_TEMP/release-gates.ts"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Validate the published release tag and database target
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_CONFIRMATION: ${{ inputs.database }}
        run: |
          test "$DATABASE_CONFIRMATION" = "ludovico-tech-production"
          node "$RUNNER_TEMP/release-gates.ts" validate-tag "$RELEASE_TAG"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          release_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the dedicated production database
        run: pnpm config:check:production

      - name: Apply reviewed production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler d1 migrations apply DB
          --config wrangler.jsonc --remote --env production

      - name: Verify every release migration is applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute DB --config wrangler.jsonc --remote --env production \
            --command "SELECT name FROM d1_migrations ORDER BY id" --json \
            > "$RUNNER_TEMP/applied-migrations.json"
          node "$RUNNER_TEMP/release-gates.ts" check-migrations \
            migrations "$RUNNER_TEMP/applied-migrations.json"
