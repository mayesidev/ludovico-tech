name: Deploy Staging

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published semantic-release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      vars.STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.release.outputs.found }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out the trusted release resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve an exact published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          release_tag="$REQUESTED_TAG"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            mapfile -t candidate_tags < <(git tag --points-at "$TRIGGER_SHA" --list 'v*')
            if [ "${#candidate_tags[@]}" -eq 0 ]; then
              printf 'found=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "${#candidate_tags[@]}" -eq 1
            release_tag="${candidate_tags[0]}"
          fi

          node scripts/release-gates.ts validate-tag "$release_tag"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$release_tag"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          release_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          if [ -n "$TRIGGER_SHA" ]; then
            test "$release_sha" = "$TRIGGER_SHA"
          fi

          printf 'found=true\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.found == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Check out the trusted deployment gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Preserve the trusted deployment gate
        run: cp scripts/release-gates.ts "$RUNNER_TEMP/release-gates.ts"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check out the exact published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "$RUNNER_TEMP/release-gates.ts" validate-tag "$RELEASE_TAG"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate staging configuration and target
        run: |
          pnpm config:check:staging
          node "$RUNNER_TEMP/release-gates.ts" validate-target \
            "$STAGING_BASE_URL" "$RELEASE_TAG" "$RELEASE_SHA" staging

      - name: Audit production dependencies
        run: pnpm audit:production

      - name: Check production dependency licenses
        run: pnpm licenses:check

      - name: Build release assets
        run: pnpm build:staging

      - name: Prepare staging deployment secrets
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          umask 077
          for secret_name in \
            TMDB_READ_ACCESS_TOKEN \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            GOOGLE_REDIRECT_URI \
            ALLOWED_EMAILS
          do
            if [ -z "${!secret_name}" ]; then
              printf 'Required staging secret %s is not configured\n' "$secret_name" >&2
              exit 1
            fi
          done

          jq -n '{
            TMDB_READ_ACCESS_TOKEN: env.TMDB_READ_ACCESS_TOKEN,
            GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET,
            GOOGLE_REDIRECT_URI: env.GOOGLE_REDIRECT_URI,
            ALLOWED_EMAILS: env.ALLOWED_EMAILS
          }' > "$RUNNER_TEMP/staging-secrets.json"

      - name: Deploy exact release in maintenance mode
        id: maintenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy \
            --secrets-file "$RUNNER_TEMP/staging-secrets.json" \
            --var "APP_VERSION:${RELEASE_TAG}" \
            --var "GIT_SHA:${RELEASE_SHA}" \
            --var "MAINTENANCE_MODE:true"

      - name: Verify maintenance mode owns staging traffic
        run: |
          node "$RUNNER_TEMP/release-gates.ts" verify-maintenance \
            "$STAGING_BASE_URL" "$RELEASE_TAG" "$RELEASE_SHA" staging

      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler d1 migrations apply DB
          --config wrangler.jsonc --remote --env staging

      - name: Verify exact release migration set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute DB --config wrangler.jsonc --remote --env staging \
            --command "SELECT name FROM d1_migrations ORDER BY id" --json \
            > "$RUNNER_TEMP/applied-migrations.json"
          node "$RUNNER_TEMP/release-gates.ts" check-migrations \
            migrations "$RUNNER_TEMP/applied-migrations.json"

      - name: Deploy exact release commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy \
            --secrets-file "$RUNNER_TEMP/staging-secrets.json" \
            --var "APP_VERSION:${RELEASE_TAG}" \
            --var "GIT_SHA:${RELEASE_SHA}" \
            --var "MAINTENANCE_MODE:false"

      - name: Verify deployed release health
        run: |
          node "$RUNNER_TEMP/release-gates.ts" verify-deployment \
            "$STAGING_BASE_URL" "$RELEASE_TAG" "$RELEASE_SHA" staging

      - name: Restore maintenance mode after cutover failure
        if: ${{ failure() && steps.maintenance.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy \
            --secrets-file "$RUNNER_TEMP/staging-secrets.json" \
            --var "APP_VERSION:${RELEASE_TAG}" \
            --var "GIT_SHA:${RELEASE_SHA}" \
            --var "MAINTENANCE_MODE:true"

      - name: Verify maintenance fallback
        if: ${{ failure() && steps.maintenance.outcome == 'success' }}
        run: |
          node "$RUNNER_TEMP/release-gates.ts" verify-maintenance \
            "$STAGING_BASE_URL" "$RELEASE_TAG" "$RELEASE_SHA" staging
